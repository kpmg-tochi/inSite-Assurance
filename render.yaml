services:
  # 1. Backend Express + Prisma API
  - type: web
    name: insite-api
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npm install && npm run build:shared && npm --workspace=@insite/server run prisma:generate && npm --workspace=@insite/server run build
    startCommand: npm --workspace=@insite/server run prisma:migrate:deploy && npm --workspace=@insite/server run start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: insite-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_API_VERSION
        value: "2024-10-21"
      - key: AZURE_OPENAI_GPT_DEPLOYMENT
        value: "gpt-4.1"
      - key: WHISPER_API_KEY
        sync: false
      - key: WHISPER_MODEL
        value: "whisper-1"
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: "auto"
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

  # 2. Role-Segregated Vite React Web Portal
  - type: web
    name: insite-web
    runtime: static
    rootDir: .
    buildCommand: npm install && npm run build:shared && npm --workspace=@insite/web run build
    staticPublishPath: ./web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

databases:
  - name: insite-db
    databaseName: insite_assurance
    user: insite_admin
    plan: basic-256mb

