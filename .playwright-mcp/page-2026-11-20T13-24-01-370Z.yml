            - generic [ref=f4e116]:
              - generic [ref=f4e117]: Who We Are
              - heading "Universal Basic Education Commission (UBEC)" [level=2] [ref=f4e118]
              - paragraph [ref=f4e119]: The Universal Basic Education Commission (UBEC) is a Federal Governments Agency saddled with the responsibility for coordinating all aspects of UBE programme implementation. The Universal Basic Education Programme was introduced in 1999 by the Federal Government of Nigeria as a reform programme aimed at providing greater access to, and ensuring quality of basic education throughout Nigeria.
              - link [ref=f4e120] [cursor=pointer]:
                - /url: /about/about-us
                - button "Discover More" [ref=f4e121]
          - generic [ref=f4e124]:
            - generic [ref=f4e125]:
              - heading "Empowering Every Nigerian Child with Quality Basic Education" [level=2] [ref=f4e126]
              - paragraph [ref=f4e127]: The Universal Basic Education Commission (UBEC) is Nigeria's federal agency responsible for coordinating and implementing the Universal Basic Education programme, ensuring access to free and compulsory education for every child.
            - generic [ref=f4e128]:
              - generic [ref=f4e129]:
                - heading "Ensure Access to Education" [level=3] [ref=f4e131]
                - paragraph [ref=f4e132]: Provide free, compulsory, and quality basic education from early childhood through junior secondary level.
              - generic [ref=f4e133]:
                - heading "Reduce Illiteracy and Inequality" [level=3] [ref=f4e135]
                - paragraph [ref=f4e136]: Bridge educational gaps, reduce disparities, and promote equal learning opportunities across Nigeria.
              - generic [ref=f4e137]:
                - heading "Strengthen Education Systems" [level=3] [ref=f4e139]
                - paragraph [ref=f4e140]: Coordinate with states and stakeholders to improve learning outcomes, infrastructure, and overall education delivery.
        - generic [ref=f4e142]:
          - generic [ref=f4e143]:
            - heading "What We Provide" [level=2] [ref=f4e144]
            - paragraph [ref=f4e145]: Providing structured and inclusive basic education that supports children from early learning through primary and junior secondary levels, ensuring a strong and continuous foundation for lifelong learning.
          - generic [ref=f4e146]:
            - generic [ref=f4e147]:
              - img "Early Child Care Development" [ref=f4e149]
              - generic [ref=f4e150]:
                - heading "Early Child Care Development" [level=3] [ref=f4e151]
                - paragraph [ref=f4e152]: Pre–primary education is the education given to younger learners before the age of entering primary education (6 years). Early childhood education or pre-primary education is defined by the National Policy on Education.
            - generic [ref=f4e153]:
              - img "Primary Education" [ref=f4e155]
              - generic [ref=f4e156]:
                - heading "Primary Education" [level=3] [ref=f4e157]
                - paragraph [ref=f4e158]: The Universal Basic Education COMMISSION, UBEC, came as a replacement of the Universal Primary Education and intended to enhance the success of the first nine years of schooling. The UBE involves 6 years of Primary School.
            - generic [ref=f4e159]:
              - img "Junior Secondary Education" [ref=f4e161]
              - generic [ref=f4e162]:
                - heading "Junior Secondary Education" [level=3] [ref=f4e163]
                - paragraph [ref=f4e164]: Junior Secondary is a phase of education in state secondary schools for Years 12, 13 and 14, which helps to ensure the bridge between primary and secondary school is safe, strong and consistent for all students.
